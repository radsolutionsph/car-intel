title: Carousel
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: image
            field:
              max_files: 1
              container: assets
              type: assets
              display: Image
          -
            handle: caption
            field:
              buttons:
                - h1
                - h2
                - h3
                - bold
                - italic
                - alignleft
                - aligncenter
                - alignright
                - removeformat
                - quote
                - anchor
                - image
                - table
              remove_empty_nodes: false
              type: bard
              display: Caption
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
