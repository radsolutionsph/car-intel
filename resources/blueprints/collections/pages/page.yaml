title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: meta_description
            field:
              type: textarea
              display: 'Meta Description'
              instructions: 'Used for SEO description meta tag.'
              character_limit: 160
          -
            import: composition_pages
  options:
    display: Options
    sections:
      -
        fields:
          -
            handle: show_in_nav
            field:
              type: toggle
              display: 'Show In Nav'
              default: true
          -
            handle: navigation_title
            field:
              type: text
              display: 'Navigation Title'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
  titlestrip:
    display: 'Title Strip'
    sections:
      -
        fields:
          -
            handle: titlestrip_option
            field:
              options:
                -
                  key: default
                  value: Default
                -
                  key: disabled
                  value: Disabled
              default: default
              type: select
              display: 'Titlestrip Option'
              width: 50
          -
            handle: titlestrip_text
            field:
              type: markdown
              display: 'Titlestrip Text'
              antlers: true
              instructions: 'This can include Antlers tags such as ``{{ title }}``.'
              instructions_position: below
              always_save: true
              if:
                titlestrip_option: 'not disabled'
          -
            handle: titlestrip_image
            field:
              type: assets
              display: 'Titlestrip Image'
              max_files: 1
              container: assets
              folder: titlestrips
              always_save: true
              if:
                titlestrip_option: 'not disabled'
