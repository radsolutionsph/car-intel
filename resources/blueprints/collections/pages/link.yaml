title: Link
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              validate:
                - required
          -
            handle: redirect
            field:
              type: link
              display: Redirect
              validate:
                - required
              width: 66
          -
            handle: open_in_new_tab
            field:
              type: toggle
              display: 'Open in a New Tab'
              width: 33
  options:
    display: Options
    sections:
      -
        fields:
          -
            handle: show_in_nav
            field:
              type: toggle
              display: 'Show In Nav'
              default: true
          -
            handle: navigation_title
            field:
              type: text
              display: 'Navigation Title'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
