
<div class="row popup-gallery">
    {{ images }}
    <div class="col-xl-3 col-lg-3 col-md-4 col-6 thumb">
        <a href="{{ glide:url square="{{ site_settings.popup_maximum }}" fit="max" }}" class="thumbnail">
            <img class="d-block w-100 img-fluid img-thumbnail" src="{{ glide:url width="255" height="170" fit="crop_focal" }}" alt="{{ url | get:alt }}" title="{{ url | get:title }}">
        </a>
    </div>
    {{ /images }}
</div>
