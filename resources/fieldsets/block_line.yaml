title: Line
fields:
  -
    field:
      display: 'View Options'
      type: revealer
      mode: toggle
      instructions: 'Animate, Schedule & Wrap Options'
    handle: options
  -
    field:
      fullscreen: false
      always_save: true
      type: group
      display: 'Animate Options'
      if:
        options: 'equals true'
      fields:
        -
          handle: delay
          field:
            append: ms
            type: integer
            display: Delay
            instructions: 'Default 300ms'
            width: 50
            validate:
              - 'gte:0'
            unless:
              $parent:
                wrap_options:
                  enabled: 'equals false'
        -
          handle: type
          field:
            options:
              disable: Disable
              fadeIn: 'Fade In'
              fadeInLeft: 'Fade In Left'
              fadeInRight: 'Fade In Right'
              fadeInUp: 'Fade In Up'
            placeholder: 'Animation Type'
            clearable: true
            type: select
            display: Type
            instructions: 'Default Fade In Up'
            width: 50
            unless:
              $parent:
                wrap_options:
                  enabled: 'equals false'
    handle: animate_options
  -
    field:
      fullscreen: false
      always_save: true
      type: group
      display: 'Schedule Options'
      if:
        options: 'equals true'
      fields:
        -
          field:
            time_enabled: true
            type: date
            display: Start
            width: 50
          handle: start
        -
          field:
            time_enabled: true
            type: date
            display: End
            width: 50
          handle: end
    handle: schedule_options
  -
    field:
      fullscreen: false
      always_save: true
      type: group
      display: 'Wrap Options'
      if:
        options: 'equals true'
      fields:
        -
          handle: enabled
          field:
            default: true
            display: Wrap
            type: toggle
            instructions: 'Include the line in the content wrap'
            always_save: false
    handle: wrap_options
