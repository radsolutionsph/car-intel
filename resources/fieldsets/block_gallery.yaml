title: Gallery
fields:
  -
    handle: images
    field:
      type: assets
      container: assets
      folder: /
      mode: grid
      display: Images
  -
    handle: gallery_columns
    field:
      options:
        1: 'One (100%)'
        2: 'Two (50%)'
        3: 'Three (33.3%)'
        4: 'Four (25%)'
        6: 'Six (16.6%)'
        12: 'Twelve (8.3%)'
      default: '4'
      display: Columns
      type: select
      instructions: "Number of columns in gallery at 'desktop' breakpoint (1100px)."
      always_save: false
  -
    field:
      display: 'View Options'
      type: revealer
      mode: toggle
      instructions: 'Lightbox, Animate & Schedule Options'
    handle: options
  -
    field:
      fullscreen: false
      always_save: true
      type: group
      display: 'Lightbox Options'
      if:
        options: 'equals true'
      fields:
        -
          handle: disable_click_enlarge
          field:
            type: toggle
            display: 'Disable Click Enlarge'
            width: 50
        -
          handle: disable_caption
          field:
            type: toggle
            display: 'Disable Caption'
            width: 50
            instructions: "Do not use the image 'Alt' value as caption (if set)."
            unless:
              disable_click_enlarge: true
    handle: lightbox_options
  -
    field:
      fullscreen: false
      always_save: true
      type: group
      display: 'Animate Options'
      if:
        options: 'equals true'
      fields:
        -
          handle: delay
          field:
            append: ms
            type: integer
            display: Delay
            instructions: 'Default 300ms'
            width: 50
            validate:
              - 'gte:0'
            unless:
              $parent.wrap_options.enabled: 'equals false'
        -
          handle: type
          field:
            options:
              disable: Disable
              fadeIn: 'Fade In'
              fadeInLeft: 'Fade In Left'
              fadeInRight: 'Fade In Right'
              fadeInUp: 'Fade In Up'
            placeholder: 'Animation Type'
            clearable: true
            type: select
            display: Type
            instructions: 'Default Fade In Up'
            width: 50
            unless:
              $parent.wrap_options.enabled: 'equals false'
    handle: animate_options
  -
    field:
      fullscreen: false
      always_save: true
      type: group
      display: 'Schedule Options'
      if:
        options: 'equals true'
      fields:
        -
          field:
            time_enabled: true
            type: date
            display: Start
            width: 50
          handle: start
        -
          field:
            time_enabled: true
            type: date
            display: End
            width: 50
          handle: end
    handle: schedule_options
